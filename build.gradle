plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = "1.0.0"
group = "com.autobuild"

repositories {
    mavenCentral()
    // Khai báo đầy đủ cả 2 kho releases và snapshots của Meteor Client
    maven {
        name = "Meteor Releases"
        url = "https://maven.meteorclient.com/releases"
    }
    maven {
        name = "Meteor Snapshots"
        url = "https://maven.meteorclient.com/snapshots"
    }
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.0"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.102.0+1.21.1"

    // Dependency chính thức của Meteor Client 0.5.8 cho 1.21.1
    modImplementation "meteordevelopment:meteor-client:0.5.8"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}
