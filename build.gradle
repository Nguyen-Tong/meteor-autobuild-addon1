plugins {
    id 'fabric-loom' version '1.7.4'
    id 'maven-publish'
}

version = "1.0.0"
group = "com.autobuild"

// Tự động tải Baritone API trực tiếp từ GitHub nếu chưa có
File libsDir = new File(projectDir, "libs")
if (!libsDir.exists()) {
    libsDir.mkdirs()
}
File baritoneApiJar = new File(libsDir, "baritone-api-1.11.3.jar")
if (!baritoneApiJar.exists()) {
    try {
        println "Đang tải Baritone API v1.11.3 trực tiếp từ GitHub..."
        new URL("https://github.com/cabaletta/baritone/releases/download/v1.11.3/baritone-api-1.11.3.jar").withInputStream { input ->
            baritoneApiJar.withOutputStream { output ->
                output << input
            }
        }
        println "Tải thành công Baritone API!"
    } catch (Exception e) {
        println "Không thể tải tự động: " + e.message
    }
}

repositories {
    mavenCentral()
    maven { 
        name = "Meteor Releases"
        url = "https://maven.meteordev.org/releases" 
    }
    maven { 
        name = "Meteor Snapshots"
        url = "https://maven.meteordev.org/snapshots" 
    }
    maven { 
        name = "Fabric"
        url = "https://maven.fabricmc.net/" 
    }
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.0"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.102.0+1.21.1"
    modImplementation "meteordevelopment:meteor-client:0.5.8"
    
    modCompileOnly name: 'baritone-api-1.11.3'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}
