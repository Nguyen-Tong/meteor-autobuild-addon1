name: Build Fabric Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Tự động tải Meteor Client JAR
        run: |
          mkdir -p libs
          curl -L -o libs/meteor-client-0.5.8.jar https://github.com/MeteorDevelopment/meteor-client/releases/download/0.5.8/meteor-client-0.5.8.jar

      - name: Build with Gradle
        run: gradle build
        
      - name: Upload compiled Jar
        uses: actions/upload-artifact@v4
        with:
          name: meteor-autobuild-jar
          path: build/libs/*.jar
          
